    ylim: [-0.8, 0.6]
    relative_plane: "Table"
    yaml_path: "Clutter/clutter.yml"
    nums: 1 # minimal clutter -> random cheat-lift pick hits the leftmost target ~50%
    mode: "category_unique" # allow_duplicate (default), unique, category_unique
    rotate_rand: True
    rotate_deg: 30
    margin: 0.02