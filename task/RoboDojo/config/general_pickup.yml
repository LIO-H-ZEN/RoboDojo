# ---------------------------------------------------------------------------
# Evaluation length
# ---------------------------------------------------------------------------
step_lim: 200                  # ~8s @ 25 steps/s (fail episodes run this long)

# Verification hook (position-only, does NOT force success): at this control
# step (kept a bit later than the opening frames so the scene/gripper settle
# first), teleport ONE randomly-selected tabletop rigid body (spatial target
# OR clutter) to its pre_z + 0.25 m. Because the pick is random, the
# spatial-target (leftmost) lift check yields a natural success/failure mix
# across episodes (more episodes -> the ~1/(1+clutter) per-episode target
# probability shows up) - validating prompt generation, target resolution and
# success detection end-to-end without a real policy. 0 = disabled.
cheat_lift_step: 40
cheat_lift_z_delta: 0.25   # lift height above the object's initial pre_state z

# ---------------------------------------------------------------------------
# Table display: DISABLED for this validation run. The per-step video-frame
# refresh dominated render + log traffic; an empty playlist + change_interval
# 0 + empty image list leaves the default table material (no image path at
# all). Kept as flat legacy keys so the deployment-safe interface stays valid.
# ---------------------------------------------------------------------------
table_display_playlist: []
table_image_change_interval: 0
table_image_list: []

table_rearrange_interval: 312       # re-shuffle tabletop objects every N steps (0=off)
table_rearrange_rotate_deg: 20
table_rearrange_margin: 0.02

